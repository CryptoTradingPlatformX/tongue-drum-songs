<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Browse public-domain songs in numbered notation for C and D major steel tongue drums. See which tongue to play, and practice with a synthesized tone."
    />
    <meta name="theme-color" content="#f3e6d3" />
    <title>Tongue Drum Songs</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="theme-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,560;9..144,700&display=swap" />
    <script>
      (function () {
        var key = "tongue-drum-appearance";
        var choice = "classic";
        try {
          var saved = localStorage.getItem(key);
          if (saved) choice = saved;
        } catch (e) {}
        var skins = { classic: 1, clarity: 1, neon: 1, cozy: 1, command: 1, headline: 1, lavender: 1 };
        if (choice !== "system" && !skins[choice]) choice = "classic";
        var dark = false;
        try {
          dark = matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {}
        var theme = choice === "system" ? (dark ? "neon" : "clarity") : choice;
        var root = document.documentElement;
        root.setAttribute("data-appearance", choice);
        root.setAttribute("data-theme", theme);
        var color = {
          classic: "#f3e6d3",
          clarity: "#ffffff",
          neon: "#0b0b12",
          cozy: "#fff8f1",
          command: "#f1f5f9",
          headline: "#f4f1ea",
          lavender: "#f5f1ff",
        }[theme];
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && color) meta.setAttribute("content", color);
        var fonts = {
          classic: "https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,560;9..144,700&display=swap",
          clarity: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap",
          neon: "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap",
          cozy: "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap",
          command: "https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap",
          headline: "https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap",
          lavender: "https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap",
        };
        var link = document.getElementById("theme-font");
        if (link && fonts[theme]) link.setAttribute("href", fonts[theme]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>Tongue Drum Songs needs JavaScript to show the library and play the preview tone.</noscript>
  </body>
</html>
